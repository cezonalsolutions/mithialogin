
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITHAI - Profile</title>

<style>
/* FIXED HEADER */
.mithai-profile-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 110px;
  padding: 35px 18px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #ffffff;
  border-bottom: 1px solid #e0e5ec;
  box-sizing: border-box;
  z-index: 9999;
}

.mithai-profile-back {
  width: 40px;
  height: 40px;
  border: 1px solid #dce3ed;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
}

.mithai-profile-back svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: #111820;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mithai-profile-title {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 22px;
  font-weight: 750;
  color: #111820;
}

/* PROFILE DETAILS - FULL WIDTH BACKGROUND */
.mithai-profile-details {
  margin-top: 110px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;

  background: #f5f6f8;
  font-family: Arial, sans-serif;

  /* FULL SCREEN WIDTH */
  width: 100vw;
  max-width: none;
  box-sizing: border-box;

  /* REMOVE PARENT SIDE GAPS */
  margin-left: calc(50% - 50vw);
  margin-right: 0;
}

/* SMALL PROFILE CIRCLE */
.mithai-profile-avatar {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #eadcfb;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}

/* OLD PURPLE ICON */
.mithai-profile-avatar svg {
  width: 64px;
  height: 64px;
  display: block;
  fill: #913ad2;
  flex-shrink: 0;
  transform: translateY(4px);
}

/* NAME AND PHONE */
.mithai-profile-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.mithai-profile-name {
  font-size: 21px;
  font-weight: 750;
  color: #111820;
}

.mithai-profile-phone {
  font-size: 14px;
  color: #657084;
}

/* THREE PROFILE BOXES */
.mithai-profile-quick-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  padding: 12px 16px 25px;
  background: #f5f6f8;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  box-sizing: border-box;
}

/* EACH BOX */
.mithai-profile-action {
  min-width: 0;
  height: 115px;
  background: #ffffff;
  border: 1px solid #dce3ed;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 5px;
  cursor: pointer;
  font-family: Arial, sans-serif;
}

.mithai-profile-action svg {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: #111820;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.mithai-profile-action span {
  font-size: 14px;
  font-weight: 700;
  color: #111820;
  text-align: center;
  line-height: 1.4;
}

.mithai-profile-action:active {
  background: #f9f5fc;
  transform: scale(0.98);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="mithai-profile-header">
  <button
    type="button"
    class="mithai-profile-back"
    onclick="window.history.back()"
    aria-label="Go back"
  >
    <svg viewBox="0 0 24 24">
      <path d="M15 18L9 12L15 6"/>
    </svg>
  </button>

  <h1 class="mithai-profile-title">Profile</h1>
</header>

<!-- PROFILE DETAILS -->
<div class="mithai-profile-details">

  <div class="mithai-profile-avatar">
    <svg
      viewBox="-4 -4 72 72"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <circle cx="32" cy="23" r="14"/>
      <path d="M5 64c2-18 13-27 27-27s25 9 27 27z"/>
    </svg>
  </div>

  <div class="mithai-profile-info">
    <div class="mithai-profile-name" id="profileName">
      Your Name
    </div>

    <div class="mithai-profile-phone" id="profilePhone">
      +91 00000 00000
    </div>
  </div>

</div>

<!-- THREE PROFILE BOXES -->
<div class="mithai-profile-quick-actions">

  <!-- YOUR ORDERS -->
  <button class="mithai-profile-action"
          type="button"
          onclick="window.location.href='orders.html'">

    <svg viewBox="0 0 24 24">
      <rect x="3" y="7" width="18" height="14" rx="3"/>
      <path d="M8 7V5a4 4 0 0 1 8 0v2"/>
    </svg>

    <span>Your<br>Orders</span>
  </button>

  <!-- HELP & SUPPORT -->
  <button class="mithai-profile-action"
          type="button"
          onclick="window.location.href='support.html'">

    <svg viewBox="0 0 24 24">
      <path d="M4 5h13a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H9l-5 3v-5a4 4 0 0 1-3-4V9a4 4 0 0 1 3-4Z"/>
      <path d="M7 12h.01M12 12h.01M17 12h.01"/>
    </svg>

    <span>Help &amp;<br>Support</span>
  </button>

  <!-- YOUR WISHLIST -->
  <button class="mithai-profile-action"
          type="button"
          onclick="window.location.href='wishlist.html'">

    <svg viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
    </svg>

    <span>Your<br>Wishlist</span>
  </button>

</div>

</body>
</html>
