
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Delivery + Cart</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

/* BOTH BARS */
.deliveryCartRow {
  width: calc(100% - 32px);
  margin: 25px 16px 0;
  display: flex;
  align-items: stretch;
  gap: 8px;
}

/* ORIGINAL GREEN DELIVERY DESIGN */
.deliveryFloatBar {
  flex: 1;
  min-width: 0;
  min-height: 65px;
  padding: 12px 16px;
  background: #087f5b;
  display: flex;
  align-items: center;
  border-radius: 16px;
  overflow: hidden;
}

/* DELIVERY ICON */
.deliveryIcon {
  position: relative;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15px;
  flex-shrink: 0;
}

.deliveryIcon i {
  color: #ffffff;
  font-size: 15px;
}

/* PROGRESS RING */
.freeProgressRing {
  position: absolute;
  inset: -5px;
  width: 44px;
  height: 44px;
  transform: rotate(-90deg);
}

.freeProgressRing circle {
  fill: none;
  stroke-width: 4;
}

.ringBg {
  stroke: rgba(255,255,255,.16);
}

.ringFill {
  stroke: #ffffff;
  stroke-linecap: round;
  stroke-dasharray: 94.25;
  stroke-dashoffset: 94.25;
  transition: stroke-dashoffset .35s ease;
}

/* DELIVERY TEXT */
.deliveryText {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.deliveryTitle {
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.15;
}

.deliverySub {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,.78);
  line-height: 1.2;
}

/* PINK CART */
.pinkCartBar {
  width: 115px;
  flex: 0 0 115px;
  min-height: 65px;
  padding: 8px;
  background: #E82B65;
  color: #ffffff;
  border: none;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.pinkCartBar:active {
  opacity: 0.9;
}

.pinkCartIcon {
  font-size: 25px;
  color: #ffffff;
  flex-shrink: 0;
}

.pinkCartText {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  white-space: nowrap;
}

.pinkCartTitle {
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.1;
}

.pinkCartCount {
  font-family: Arial, sans-serif;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
}

/* SMALL MOBILE */
@media (max-width: 380px) {
  .deliveryCartRow {
    width: calc(100% - 20px);
    margin: 25px 10px 0;
    gap: 6px;
  }

  .deliveryFloatBar {
    padding: 10px;
  }

  .deliveryIcon {
    margin-right: 12px;
  }

  .deliveryTitle {
    font-size: 12px;
  }

  .deliverySub {
    font-size: 10px;
  }

  .pinkCartBar {
    width: 98px;
    flex-basis: 98px;
    gap: 6px;
    padding: 6px;
  }

  .pinkCartIcon {
    font-size: 21px;
  }

  .pinkCartTitle {
    font-size: 14px;
  }

  .pinkCartCount {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<!-- FREE DELIVERY + PINK CART -->
<div class="deliveryCartRow">

  <!-- GREEN DELIVERY -->
  <div class="deliveryFloatBar" id="mithaiFreeDeliveryBar">

    <div class="deliveryIcon">
      <i class="fa-solid fa-person-biking"></i>

      <svg class="freeProgressRing" viewBox="0 0 36 36">
        <circle class="ringBg"
                cx="18" cy="18" r="15"></circle>

        <circle class="ringFill"
                id="freeDeliveryRing"
                cx="18" cy="18" r="15"></circle>
      </svg>
    </div>

    <div class="deliveryText">
      <div class="deliveryTitle">
        Popular around your area
      </div>

      <div class="deliverySub">
        Shop for ₹200 to unlock free delivery
      </div>
    </div>

  </div>

  <!-- PINK CART -->
  <button class="pinkCartBar"
          type="button"
          onclick="openMithaiCart()">

    <i class="fa-solid fa-basket-shopping pinkCartIcon"></i>

    <div class="pinkCartText">
      <span class="pinkCartTitle">Cart</span>
      <span class="pinkCartCount" id="pinkCartCount">
        0 items
      </span>
    </div>

  </button>

</div>

<script>
const FREE_DELIVERY_TARGET = 200;

function updateFreeDeliveryProgress(cartTotal) {

  const total = Math.max(0, Number(cartTotal) || 0);
  const pending = Math.max(FREE_DELIVERY_TARGET - total, 0);

  const ring = document.getElementById("freeDeliveryRing");
  const title = document.querySelector(".deliveryTitle");
  const sub = document.querySelector(".deliverySub");

  const progress = Math.min(total / FREE_DELIVERY_TARGET, 1);

  if (ring) {
    ring.style.strokeDashoffset = 94.25 * (1 - progress);
  }

  if (title && sub) {
    if (total >= FREE_DELIVERY_TARGET) {
      title.innerText = "Free Delivery Unlocked";
      sub.innerText = "Your order is eligible for free delivery";
    } else {
      title.innerText = "Popular around your area";
      sub.innerText =
        `Shop for ₹${pending} to unlock free delivery`;
    }
  }
}

/* UPDATE CART ITEM COUNT */
function updatePinkCartCount(count) {
  const quantity = Math.max(0, Math.floor(Number(count) || 0));
  const el = document.getElementById("pinkCartCount");

  if (el) {
    el.textContent =
      quantity + (quantity === 1 ? " item" : " items");
  }
}

/* CART CLICK */
function openMithaiCart() {
  // Connect your existing cart opening function here.
  if (typeof window.openCart === "function") {
    window.openCart();
  }
}

/* INITIAL VALUES */
updateFreeDeliveryProgress(0);
updatePinkCartCount(0);

/* EXAMPLES:
updateFreeDeliveryProgress(150);
updatePinkCartCount(1);

updateFreeDeliveryProgress(250);
updatePinkCartCount(17);
*/
</script>

</body>
</html>
